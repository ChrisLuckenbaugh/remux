apiVersion: v1
kind: ConfigMap
metadata:
  name: remux-config
  labels:
    app.kubernetes.io/name: remux
data:
  # Mounted at /etc/remux/config.toml and picked up via CONFIG=/etc/remux/config
  # (the `config` crate resolves the extension automatically).
  #
  # Precedence note: environment variables override this file. The remux image
  # bakes DATABASE_URL, DATA_DIR and TORRENT_DATA_DIR as image env vars, so
  # those three settings must be changed via `env` in deployment.yaml, not here.
  config.toml: |
    # HTTP port the server listens on (Service and probes assume 3000).
    port = 3000

    # Log queries slower than this many milliseconds.
    slow_query_threshold_ms = 10000

    # Torrent networking. The peer port is announced to trackers; it only needs
    # to be reachable from outside the cluster if you want incoming peers
    # (see the commented hostPort in deployment.yaml). Outbound-only works fine.
    torrent_peer_port = 6881
    torrent_http_port = 9876

    # Disable the DHT gossip socket (useful on restricted cluster networks).
    disable_dht = false

    # Path to the bgutil-pot binary used by yt-dlp (baked into the image).
    bgutil_script_path = "/usr/local/bin/bgutil-pot"

    # External service base URLs.
    tmdb_base_url = "https://api.themoviedb.org/3/"
    trakt_base_url = "https://api.trakt.tv"

    # remuxdb probe submission endpoint. Comment out to disable.
    remuxdb_url = "https://remuxdb.1632022.xyz"
