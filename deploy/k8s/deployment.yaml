apiVersion: apps/v1
kind: Deployment
metadata:
  name: remux
  labels:
    app.kubernetes.io/name: remux
  annotations:
    # Stakater Reloader: roll this Deployment whenever remux-config (or a
    # referenced Secret) changes. Requires Reloader to be installed in the
    # cluster: https://github.com/stakater/Reloader
    reloader.stakater.com/auto: "true"
spec:
  # SQLite allows exactly one writer — never scale this above 1, and use
  # Recreate so an old pod fully releases the database before a new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: remux
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remux
    spec:
      containers:
        - name: remux
          image: ghcr.io/lostb1t/remux:latest
          env:
            # Base path for the config file; resolves to /etc/remux/config.toml.
            - name: CONFIG
              value: /etc/remux/config
            # Env vars override the config file. The image already bakes
            # DATABASE_URL, DATA_DIR and TORRENT_DATA_DIR pointing at /data,
            # which matches the PVC mount below — override them here (not in
            # the ConfigMap) if you ever need different paths.
          # Secrets (API tokens etc.) belong in a Secret, not the git-tracked
          # ConfigMap. Env keys map onto Config fields by lowercased name.
          # envFrom:
          #   - secretRef:
          #       name: remux-secrets
          ports:
            - name: http
              containerPort: 3000
            - name: torrent-peer
              containerPort: 6881
              # Uncomment to accept incoming torrent peers without a
              # LoadBalancer (pins the pod's peer port to the node):
              # hostPort: 6881
          volumeMounts:
            - name: config
              mountPath: /etc/remux
              readOnly: true
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /system/ping
              port: http
            # Generous window for first boot / database migrations.
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /system/ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /system/ping
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # In-memory caches alone can reach ~160Mi; leave headroom for
              # streaming and probing.
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: remux-config
        - name: data
          persistentVolumeClaim:
            claimName: remux-data
